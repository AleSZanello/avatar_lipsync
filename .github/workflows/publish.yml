# Publishes to pub.dev when a version tag is pushed (git tag v0.2.0 && git push
# origin v0.2.0). pub.dev trusts this workflow through GitHub OIDC: no secrets.
# Run it by hand (Actions > Publish > Run workflow) to validate without
# publishing.
name: Publish

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      contents: read
      id-token: write # OIDC token for pub.dev
    steps:
      - uses: actions/checkout@v4

      # Sets up the pub.dev OIDC credentials (needs id-token: write).
      - uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check that the tag matches pubspec.yaml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $version"
            exit 1
          fi

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

      - name: Example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - run: flutter pub publish --dry-run

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        run: flutter pub publish --force
