name: avatar_lipsync_example
description: A talking avatar driven by speech, built with avatar_lipsync.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  avatar_lipsync:
    path: ..
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/face.jpg
